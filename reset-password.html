<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar senha — FinanciadoCasal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #070b14; --bg2: #0d1424; --bg3: #141d2e;
      --accent: #5ee7b0; --text1: #f1f5f9; --text2: #94a3b8; --text3: #4a5568;
      --danger: #ff6b6b;
    }
    body { background: var(--bg); color: var(--text1); font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    .logo-link { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text1); margin-bottom: 32px; }
    .logo-link span { font-size: 18px; font-weight: 700; }
    .card { background: var(--bg2); border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; padding: 36px 32px; width: 100%; max-width: 420px; }
    .card h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .card p.subtitle { font-size: 14px; color: var(--text2); margin-bottom: 28px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 12px; font-weight: 500; color: var(--text2); margin-bottom: 6px; }
    .field input { width: 100%; background: var(--bg3); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 13px 14px; font-size: 15px; color: var(--text1); font-family: 'Inter', sans-serif; transition: border-color .2s; outline: none; }
    .field input:focus { border-color: var(--accent); }
    .field input::placeholder { color: var(--text3); }
    .btn-primary { width: 100%; background: var(--accent); color: #070b14; border: none; border-radius: 10px; padding: 14px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 6px; transition: opacity .2s, transform .1s; }
    .btn-primary:hover { opacity: .9; }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
    .error-msg { background: rgba(255,107,107,.12); border: 1px solid rgba(255,107,107,.3); border-radius: 10px; padding: 12px 14px; font-size: 13px; color: var(--danger); margin-bottom: 16px; display: none; }
    .success-msg { background: rgba(94,231,176,.12); border: 1px solid rgba(94,231,176,.3); border-radius: 10px; padding: 12px 14px; font-size: 13px; color: var(--accent); margin-bottom: 16px; display: none; }
    .links { margin-top: 22px; text-align: center; font-size: 13px; color: var(--text2); }
    .links a { color: var(--accent); text-decoration: none; font-weight: 500; }
    .links a:hover { text-decoration: underline; }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(7,11,20,.3); border-top-color: #070b14; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .icon-circle { width: 60px; height: 60px; background: rgba(94,231,176,.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
  </style>
</head>
<body>
  <a href="/" class="logo-link">
    <svg width="28" height="28" viewBox="0 0 40 40" fill="none">
      <rect width="40" height="40" rx="10" fill="#1a2035"/>
      <path d="M12 20C12 15.58 15.58 12 20 12C24.42 12 28 15.58 28 20" stroke="#5ee7b0" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M20 28C20 28 14 24.5 14 20" stroke="#5ee7b0" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M26 20C26 22.21 24.21 24 22 24C19.79 24 18 22.21 18 20" stroke="#7eb8f5" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="20" cy="20" r="2" fill="#5ee7b0"/>
    </svg>
    <span>FinanciadoCasal</span>
  </a>

  <!-- Step 1: request reset -->
  <div class="card" id="step-request">
    <div class="icon-circle">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5ee7b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>
    <h1 style="text-align:center">Recuperar senha</h1>
    <p class="subtitle" style="text-align:center">Enviaremos um link para redefinir sua senha.</p>

    <div id="error-req" class="error-msg"></div>
    <div id="success-req" class="success-msg"></div>

    <div class="field">
      <label>E-mail da conta</label>
      <input type="email" id="email-req" placeholder="voces@email.com" autocomplete="email" autofocus onkeydown="if(event.key==='Enter')sendReset()">
    </div>
    <button class="btn-primary" id="btn-reset" onclick="sendReset()">Enviar link de recuperação</button>
    <div class="links"><a href="/login">← Voltar ao login</a></div>
  </div>

  <!-- Step 2: set new password (after clicking email link) -->
  <div class="card" id="step-new-pass" style="display:none">
    <div class="icon-circle">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5ee7b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
    </div>
    <h1 style="text-align:center">Nova senha</h1>
    <p class="subtitle" style="text-align:center">Escolha uma senha segura para sua conta.</p>

    <div id="error-new" class="error-msg"></div>
    <div id="success-new" class="success-msg"></div>

    <div class="field">
      <label>Nova senha</label>
      <input type="password" id="new-pass" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
    </div>
    <div class="field">
      <label>Confirmar nova senha</label>
      <input type="password" id="confirm-pass" placeholder="Repita a senha" autocomplete="new-password" onkeydown="if(event.key==='Enter')updatePassword()">
    </div>
    <button class="btn-primary" id="btn-update" onclick="updatePassword()">Salvar nova senha</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const SUPABASE_URL = 'https://unvfylyfhbqnwdnuxyzq.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVudmZ5bHlmaGJxbndkbnV4eXpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNzkwNTYsImV4cCI6MjA5NTY1NTA1Nn0.fiSnL3XZTGqgxpin5FzHHelrQu6YxuLRkky7iZTZV0I';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // If Supabase redirected here with a recovery token, show the new-password form
    sb.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY') {
        document.getElementById('step-request').style.display = 'none';
        document.getElementById('step-new-pass').style.display = 'block';
      }
    });

    async function sendReset() {
      const email = document.getElementById('email-req').value.trim();
      if (!email) { showMsg('error-req', 'Informe o e-mail.'); return; }

      const btn = document.getElementById('btn-reset');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Enviando...';

      const { error } = await sb.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/reset-password'
      });

      btn.disabled = false;
      btn.textContent = 'Enviar link de recuperação';

      if (error) { showMsg('error-req', error.message); return; }
      showMsg('success-req', `✅ Link enviado para ${email}. Verifique sua caixa de entrada (e o spam).`);
      document.getElementById('email-req').disabled = true;
      btn.style.display = 'none';
    }

    async function updatePassword() {
      const newPass = document.getElementById('new-pass').value;
      const confirm = document.getElementById('confirm-pass').value;
      if (newPass.length < 6) { showMsg('error-new', 'A senha deve ter pelo menos 6 caracteres.'); return; }
      if (newPass !== confirm) { showMsg('error-new', 'As senhas não coincidem.'); return; }

      const btn = document.getElementById('btn-update');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Salvando...';

      const { error } = await sb.auth.updateUser({ password: newPass });

      btn.disabled = false;
      btn.textContent = 'Salvar nova senha';

      if (error) { showMsg('error-new', error.message); return; }
      showMsg('success-new', '✅ Senha alterada com sucesso!');
      setTimeout(() => window.location.replace('/login'), 2000);
    }

    function showMsg(id, msg) {
      const isError = id.startsWith('error');
      const otherId = isError ? id.replace('error', 'success') : id.replace('success', 'error');
      document.getElementById(otherId).style.display = 'none';
      const el = document.getElementById(id);
      el.textContent = msg; el.style.display = 'block';
    }
  </script>
</body>
</html>

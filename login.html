<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — FinanciadoCasal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #070b14; --bg2: #0d1424; --bg3: #141d2e;
      --accent: #5ee7b0; --accent2: #7eb8f5;
      --text1: #f1f5f9; --text2: #94a3b8; --text3: #4a5568;
      --radius: 14px; --danger: #ff6b6b;
    }
    body { background: var(--bg); color: var(--text1); font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    .logo-link { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text1); margin-bottom: 32px; }
    .logo-link svg { flex-shrink: 0; }
    .logo-link span { font-size: 18px; font-weight: 700; }
    .card { background: var(--bg2); border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; padding: 36px 32px; width: 100%; max-width: 420px; }
    .card h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .card p.subtitle { font-size: 14px; color: var(--text2); margin-bottom: 28px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 12px; font-weight: 500; color: var(--text2); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px; }
    .field input { width: 100%; background: var(--bg3); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 13px 14px; font-size: 15px; color: var(--text1); font-family: 'Inter', sans-serif; transition: border-color .2s; outline: none; }
    .field input:focus { border-color: var(--accent); }
    .field input::placeholder { color: var(--text3); }
    .btn-primary { width: 100%; background: var(--accent); color: #070b14; border: none; border-radius: 10px; padding: 14px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 6px; transition: opacity .2s, transform .1s; }
    .btn-primary:hover { opacity: .9; }
    .btn-primary:active { transform: scale(.98); }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
    .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; color: var(--text3); font-size: 12px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.06); }
    .btn-google { width: 100%; background: var(--bg3); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 13px; font-size: 14px; font-weight: 500; color: var(--text1); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: background .2s; font-family: 'Inter', sans-serif; }
    .btn-google:hover { background: rgba(255,255,255,0.05); }
    .links { margin-top: 22px; text-align: center; font-size: 13px; color: var(--text2); }
    .links a { color: var(--accent); text-decoration: none; font-weight: 500; }
    .links a:hover { text-decoration: underline; }
    .error-msg { background: rgba(255, 107, 107, 0.12); border: 1px solid rgba(255, 107, 107, 0.3); border-radius: 10px; padding: 12px 14px; font-size: 13px; color: var(--danger); margin-bottom: 16px; display: none; }
    .success-msg { background: rgba(94, 231, 176, 0.12); border: 1px solid rgba(94, 231, 176, 0.3); border-radius: 10px; padding: 12px 14px; font-size: 13px; color: var(--accent); margin-bottom: 16px; display: none; }
    .forgot { display: block; text-align: right; font-size: 12px; color: var(--text2); text-decoration: none; margin-top: 6px; }
    .forgot:hover { color: var(--accent); }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(7,11,20,.3); border-top-color: #070b14; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <a href="/" class="logo-link">
    <svg width="28" height="28" viewBox="0 0 40 40" fill="none">
      <rect width="40" height="40" rx="10" fill="#1a2035"/>
      <path d="M12 20C12 15.58 15.58 12 20 12C24.42 12 28 15.58 28 20" stroke="#5ee7b0" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M20 28C20 28 14 24.5 14 20" stroke="#5ee7b0" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M26 20C26 22.21 24.21 24 22 24C19.79 24 18 22.21 18 20" stroke="#7eb8f5" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="20" cy="20" r="2" fill="#5ee7b0"/>
    </svg>
    <span>FinanciadoCasal</span>
  </a>

  <div class="card">
    <h1>Bem-vindo de volta</h1>
    <p class="subtitle">Entre na conta do casal</p>

    <div id="error-msg" class="error-msg"></div>
    <div id="success-msg" class="success-msg"></div>

    <div class="field">
      <label>E-mail</label>
      <input type="email" id="email" placeholder="voces@email.com" autocomplete="email" autofocus>
    </div>
    <div class="field">
      <label>Senha</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
    </div>
    <a href="/reset-password" class="forgot">Esqueci minha senha</a>

    <button class="btn-primary" id="btn-login" onclick="login()">Entrar</button>

    <div class="divider">ou</div>

    <button class="btn-google" onclick="loginGoogle()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continuar com Google
    </button>

    <div class="links">
      Não tem conta? <a href="/register">Criar conta grátis</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const SUPABASE_URL = 'https://unvfylyfhbqnwdnuxyzq.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVudmZ5bHlmaGJxbndkbnV4eXpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNzkwNTYsImV4cCI6MjA5NTY1NTA1Nn0.fiSnL3XZTGqgxpin5FzHHelrQu6YxuLRkky7iZTZV0I';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Already logged in → go straight to app
    sb.auth.getSession().then(({ data }) => {
      if (data.session) applySession(data.session);
    });

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.style.display = 'block';
      document.getElementById('success-msg').style.display = 'none';
    }
    function showSuccess(msg) {
      const el = document.getElementById('success-msg');
      el.textContent = msg;
      el.style.display = 'block';
      document.getElementById('error-msg').style.display = 'none';
    }
    function setLoading(on) {
      const btn = document.getElementById('btn-login');
      btn.disabled = on;
      btn.innerHTML = on ? '<span class="spinner"></span>Entrando...' : 'Entrar';
    }

    function applySession(session) {
      const meta = session.user.user_metadata || {};
      const cfg = {
        supabaseUrl: SUPABASE_URL,
        supabaseKey: SUPABASE_ANON_KEY,
        casalId: meta.casal_id || '',
        nome: meta.nome || 'Finanças do Casal',
        nomeEla: meta.nomeEla || '',
        nomeEle: meta.nomeEle || '',
        apiKey: meta.apiKey || ''
      };
      localStorage.setItem('casal_cfg', JSON.stringify(cfg));
      window.location.replace('/app');
    }

    async function login() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) { showError('Preencha e-mail e senha.'); return; }

      setLoading(true);
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      setLoading(false);

      if (error) {
        const msgs = {
          'Invalid login credentials': 'E-mail ou senha incorretos.',
          'Email not confirmed': 'Confirme seu e-mail antes de entrar.'
        };
        showError(msgs[error.message] || error.message);
        return;
      }
      applySession(data.session);
    }

    async function loginGoogle() {
      await sb.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin + '/login' }
      });
    }

    // Handle OAuth callback hash
    sb.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_IN' && session) applySession(session);
    });
  </script>
</body>
</html>
